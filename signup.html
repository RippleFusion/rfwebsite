  <style>
    :root {
      --bg: #080808;
      --cyan: #00e5ff;
      --ink: #ffffff;
      --ink-70: rgba(255,255,255,0.7);
      --ink-50: rgba(255,255,255,0.5);
      --ink-40: rgba(255,255,255,0.46);
      --ink-30: rgba(255,255,255,0.46);
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }

    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
    .nav-inner { height: 5rem; display: flex; align-items: center; justify-content: space-between; }
    .nav-inner span { font-weight: 800; letter-spacing: 0.05em; }
    .nav-links { display: none; align-items: center; gap: 2rem; }
    @media (min-width: 1024px) { .nav-links { display: flex; } }
    .nav-links a { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-50); }
    .nav-links a:hover { color: var(--ink); }

    .nav-mobile-toggle {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      width: 2.75rem; height: 2.75rem; background: none; border: 1px solid var(--border); cursor: pointer; padding: 0;
    }
    @media (min-width: 1024px) { .nav-mobile-toggle { display: none; } }
    .nav-mobile-toggle span { display: block; width: 1.1rem; height: 1px; background: var(--ink); transition: transform 0.3s ease, opacity 0.3s ease; }
    .nav-mobile-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-mobile-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .nav-mobile-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .nav-mobile-overlay {
      position: fixed; inset: 0; z-index: 90; background: rgba(8,8,8,0.98);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .nav-mobile-overlay.open { opacity: 1; visibility: visible; }
    .nav-mobile-overlay a { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.05em; color: var(--ink); }
    .nav-mobile-overlay a:hover { color: var(--cyan); }
    @media (min-width: 1024px) { .nav-mobile-overlay { display: none !important; } }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8rem 1.5rem 4rem;
      position: relative;
      overflow: hidden;
    }
    .auth-glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 640px; height: 640px; background: rgba(0,229,255,0.06); border-radius: 50%;
      filter: blur(140px); pointer-events: none;
    }

    .auth-card {
      position: relative;
      width: 100%;
      max-width: 26rem;
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--border);
      padding: 2.5rem;
    }
    .auth-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.4em; color: var(--cyan); text-transform: uppercase; margin: 0 0 1rem; }
    .auth-card h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 0.5rem; }
    .auth-card .sub { font-size: 0.875rem; color: var(--ink-50); margin: 0 0 2rem; }

    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-40); margin-bottom: 0.5rem; }
    .field input {
      width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--ink);
      padding: 0.875rem 1rem; font-size: 0.875rem; font-family: inherit;
      transition: border-color .3s ease, background .3s ease;
    }
    .field input::placeholder { color: rgba(255,255,255,0.2); }
    .field input:focus { outline: none; border-color: rgba(0,229,255,0.5); background: rgba(0,229,255,0.03); box-shadow: 0 0 0 3px rgba(0,229,255,0.15); }
    .field input[aria-invalid="true"] { border-color: rgba(248,113,113,0.6); }
    .field-error { font-size: 0.75rem; color: #f87171; margin: 0.4rem 0 0; min-height: 1em; }

    .form-error { font-size: 0.75rem; color: #f87171; margin: 0 0 1rem; display: none; }

    .submit-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 1rem;
      background: var(--cyan); color: #000; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; border: none; cursor: pointer; transition: background .3s ease, opacity .3s ease;
      margin-top: 0.5rem;
    }
    .submit-btn:hover:not(:disabled) { background: #fff; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-foot { margin-top: 1.75rem; text-align: center; font-size: 0.8rem; color: var(--ink-50); }
    .auth-foot a { color: var(--cyan); }
    .auth-foot a:hover { text-decoration: underline; }

    .auth-success {
      text-align: center; padding: 1rem 0;
    }
    .auth-success .check {
      width: 4rem; height: 4rem; margin: 0 auto 1.5rem; border: 2px solid var(--cyan);
      display: flex; align-items: center; justify-content: center; color: var(--cyan);
    }
    .auth-success h3 { font-size: 1.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem; }
    .auth-success p { font-size: 0.875rem; color: var(--ink-40); margin: 0; }

    footer { padding: 1.5rem; border-top: 1px solid var(--border); }
    footer p { text-align: center; font-size: 0.75rem; color: var(--ink-50); margin: 0; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="wrap nav-inner">
      <a href="index.html"><span>Ripple Fusion</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>

        <a href="index.html#contact">Contact</a>
      </div>
      <button type="button" class="nav-mobile-toggle" id="navMobileToggle" aria-expanded="false" aria-controls="navMobileOverlay" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="nav-mobile-overlay" id="navMobileOverlay">
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#the-problem">Services</a>
    <a href="index.html#contact">Contact</a>
  </div>

  <main>
    <div class="auth-glow"></div>
    <div class="auth-card" id="auth-card">
      <p class="auth-eyebrow">Get Started</p>
      <h1>Create your account</h1>
      <p class="sub">Sign up to start working with Ripple Fusion.</p>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="su-name">Full Name</label>
          <input id="su-name" name="name" type="text" placeholder="Jane Smith" autocomplete="name" required aria-describedby="su-name-error" />
          <p class="field-error" id="su-name-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="su-email">Email Address</label>
          <input id="su-email" name="email" type="email" placeholder="jane@company.com" autocomplete="email" required aria-describedby="su-email-error" />
          <p class="field-error" id="su-email-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="su-password">Password</label>
          <input id="su-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" aria-describedby="su-password-error" />
          <p class="field-error" id="su-password-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="su-confirm">Confirm Password</label>
          <input id="su-confirm" name="confirm" type="password" placeholder="Re-enter your password" autocomplete="new-password" required aria-describedby="su-confirm-error" />
          <p class="field-error" id="su-confirm-error" aria-live="polite"></p>
        </div>

        <p class="form-error" id="su-form-error" role="alert"></p>

        <button type="submit" class="submit-btn" id="su-submit">Sign Up</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="index.html">Log in</a></p>
    </div>
  </main>

  <footer>
    <p>© 2026 Ripple Fusion. All rights reserved.</p>
  </footer>

  <script>
    // ---------- Mobile nav menu ----------
    const navMobileToggle = document.getElementById('navMobileToggle');
    const navMobileOverlay = document.getElementById('navMobileOverlay');
    if (navMobileToggle && navMobileOverlay) {
      const closeMobileNav = () => {
        navMobileOverlay.classList.remove('open');
        navMobileToggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      };
      navMobileToggle.addEventListener('click', () => {
        const open = navMobileOverlay.classList.toggle('open');
        navMobileToggle.setAttribute('aria-expanded', String(open));
        document.body.style.overflow = open ? 'hidden' : '';
      });
      navMobileOverlay.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMobileNav));
      window.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileNav(); });
    }

    const form = document.getElementById('signup-form');
    const card = document.getElementById('auth-card');
    const submitBtn = document.getElementById('su-submit');
    const formError = document.getElementById('su-form-error');

    const fields = {
      name: { input: document.getElementById('su-name'), error: document.getElementById('su-name-error') },
      email: { input: document.getElementById('su-email'), error: document.getElementById('su-email-error') },
      password: { input: document.getElementById('su-password'), error: document.getElementById('su-password-error') },
      confirm: { input: document.getElementById('su-confirm'), error: document.getElementById('su-confirm-error') },
    };

    function setFieldError(key, message) {
      const { input, error } = fields[key];
      error.textContent = message || '';
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    function validate() {
      let valid = true;

      const name = fields.name.input.value.trim();
      if (!name) { setFieldError('name', 'Full name is required.'); valid = false; }
      else { setFieldError('name', ''); }

      const email = fields.email.input.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) { setFieldError('email', 'Email address is required.'); valid = false; }
      else if (!emailPattern.test(email)) { setFieldError('email', 'Enter a valid email address.'); valid = false; }
      else { setFieldError('email', ''); }

      const password = fields.password.input.value;
      if (!password) { setFieldError('password', 'Password is required.'); valid = false; }
      else if (password.length < 8) { setFieldError('password', 'Use at least 8 characters.'); valid = false; }
      else { setFieldError('password', ''); }

      const confirm = fields.confirm.input.value;
      if (!confirm) { setFieldError('confirm', 'Please confirm your password.'); valid = false; }
      else if (password && confirm !== password) { setFieldError('confirm', 'Passwords do not match.'); valid = false; }
      else { setFieldError('confirm', ''); }

      return valid;
    }

    Object.values(fields).forEach(({ input }) => {
      input.addEventListener('input', () => {
        if (input.getAttribute('aria-invalid') === 'true') validate();
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      formError.style.display = 'none';

      if (!validate()) {
        formError.textContent = 'Please fix the errors above.';
        formError.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account…';

      setTimeout(() => {
        card.innerHTML = `
          <div class="auth-success" role="status">
            <div class="check"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>
            <h3 tabindex="-1">Account Created</h3>
            <p>Welcome to Ripple Fusion — you're all set.</p>
          </div>`;
        // Screen reader / keyboard users lost their place when the form was
        // replaced wholesale — move focus to the confirmation so it's announced.
        card.querySelector('h3').focus();
      }, 600);
    });
  </script>

</body>
